server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything below is served by the gateway (:8080 inside compose).
    # /api/         — REST + BFF token handler (/api/v1/oauth2/*)
    # /oauth2/      — Authorization Server (authorize endpoint)
    # /login        — identity login form (part of the authorize redirect)
    # /.well-known/ — OIDC discovery / JWKS
    location ~ ^/(api|oauth2|\.well-known)/|^/login$ {
        proxy_pass http://gateway:8080;
        # $http_host, not $host — $host drops the port, which turns identity's
        # PreserveHostHeader-based /login redirect into http://localhost/login
        # (missing :5173) instead of the browser's real origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
