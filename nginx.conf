server {
    listen 80;

    # STAM-455: with a literal hostname in proxy_pass, nginx resolves
    # "gateway" once at startup and keeps that IP, so recreating the gateway
    # container (new IP) made every proxied request 502 until this container
    # restarted too. Docker's embedded DNS plus a variable upstream makes
    # nginx re-resolve at request time, caching the answer for 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything below is served by the gateway (:8080 inside compose).
    # /api/         — REST + BFF token handler (/api/v1/oauth2/*)
    # /oauth2/      — Authorization Server (authorize endpoint)
    # /login        — identity login form (part of the authorize redirect)
    # /.well-known/ — OIDC discovery / JWKS
    location ~ ^/(api|oauth2|\.well-known)/|^/login$ {
        # A variable with no URI part forwards the original request URI as-is,
        # exactly like the literal form did.
        proxy_pass $gateway_upstream;
        # $http_host, not $host — $host drops the port, which turns identity's
        # PreserveHostHeader-based /login redirect into http://localhost/login
        # (missing :5173) instead of the browser's real origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
